# Mosquitto 2.x di VPS (Linux). Dipasang ke /etc/mosquitto/conf.d/baruna.conf oleh deploy/vps/setup-broker.sh.
# File utama /etc/mosquitto/mosquitto.conf (bawaan paket) sudah mengatur pid_file, persistence_location
# (/var/lib/mosquitto/) dan log; file ini hanya menambah listener + Dynamic Security.
#
# Wajib login (allow_anonymous false). Akun device dibuat otomatis oleh API lewat Dynamic Security,
# dan setiap device hanya boleh publish ke topic miliknya (role baruna-device, lihat mosquittoDynsec.ts).

# MQTT untuk ESP32 (tanpa TLS; ganti ke 8883 + certfile/keyfile setelah ada domain).
listener 1883 0.0.0.0
allow_anonymous false

plugin /usr/lib/x86_64-linux-gnu/mosquitto_dynamic_security.so
plugin_opt_config_file /var/lib/mosquitto/dynamic-security.json

persistence true
connection_messages true
