# Nginx: dashboard (file statis hasil `npm run build`) + /api ke backend.
# Dipasang ke /etc/nginx/sites-available/baruna oleh deploy/vps/install-services.sh (__APP_DIR__ diganti).
# Sekarang HTTP lewat IP; setelah ada domain jalankan certbot --nginx untuk HTTPS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root __APP_DIR__/dist;
    index index.html;

    client_max_body_size 1m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Cache memakai `expires` (bukan add_header) agar header keamanan di atas tetap diwarisi.
    # File hasil build bernama hash: aman di-cache lama
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA: semua path lain ke index.html (no-cache agar versi baru langsung terpakai)
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
