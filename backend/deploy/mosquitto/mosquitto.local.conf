# Mosquitto lokal untuk development & test (Windows), dijalankan dari folder backend/:
#   npm run broker:local
# Port 1884 dipakai agar tidak bentrok dengan service Mosquitto bawaan Windows di 1883.
# Path relatif terhadap folder backend/. Data broker disimpan di backend/.mosquitto/ (tidak di-commit).

listener 1884 127.0.0.1
allow_anonymous false

plugin C:/PROGRA~1/mosquitto/mosquitto_dynamic_security.dll
plugin_opt_config_file .mosquitto/dynamic-security.json

persistence true
persistence_location .mosquitto/

log_type error
log_type warning
log_type notice
log_type information
connection_messages true
